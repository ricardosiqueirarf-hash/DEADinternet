<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEADinternet</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><div><small>LOCAL-FIRST · 127.0.0.1:{{ port }}</small><h1>DEADinternet</h1><p>Radar de referências para conteúdo original.</p></div><button id="refresh">Atualizar</button></header><section id="stats" class="stats"></section><section class="panel"><h2>Nova referência</h2><form id="form"><select name="platform" required><option value="instagram">Instagram</option><option value="tiktok">TikTok</option><option value="youtube">YouTube</option><option value="other">Outro</option></select><input name="url" type="url" placeholder="URL pública" required><input name="title" placeholder="Título interno"><input name="creator_name" placeholder="Criador/perfil"><input name="views" type="number" min="0" placeholder="Visualizações"><input name="likes" type="number" min="0" placeholder="Curtidas"><input name="comments" type="number" min="0" placeholder="Comentários"><input name="hook_strength" type="number" min="0" max="10" step="0.5" placeholder="Força do gancho 0–10"><input name="recreation_ease" type="number" min="0" max="10" step="0.5" placeholder="Facilidade de recriar 0–10"><input name="monetization_potential" type="number" min="0" max="10" step="0.5" placeholder="Monetização 0–10"><textarea name="source_notes" placeholder="Observações"></textarea><button type="submit">Cadastrar e pontuar</button></form><p id="message"></p></section><section class="panel"><div class="title-row"><h2>Referências</h2><select id="status"><option value="">Todos os status</option><option>captured</option><option>scored</option><option>selected</option><option>discarded</option></select></div><div id="references"></div></section></main><script>const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const status=$('#status').value;const [stats,refs]=await Promise.all([fetch('/api/stats').then(r=>r.json()),fetch('/api/references'+(status?'?status='+status:'')).then(r=>r.json())]);$('#stats').innerHTML=`<article><b>${stats.total}</b><span>Referências</span></article><article><b>${stats.average_score}</b><span>Score médio</span></article><article><b>${stats.by_status.selected||0}</b><span>Selecionadas</span></article><article><b>${stats.by_status.scored||0}</b><span>Pontuadas</span></article>`;$('#references').innerHTML=refs.length?refs.map(r=>`<article class="ref"><div><strong>${esc(r.title||r.creator_name||'Sem título')}</strong><span>${esc(r.platform)} · ${esc(r.status)}</span><a href="${esc(r.url)}" target="_blank" rel="noopener">Abrir origem</a></div><div class="score">${r.score}</div><div class="actions"><button onclick="setStatus(${r.id},'selected')">Selecionar</button><button onclick="agent(${r.id})">Enviar ao SuperCodex</button><button class="danger" onclick="removeRef(${r.id})">Excluir</button></div></article>`).join(''):'<p>Nenhuma referência cadastrada.</p>'}$('#form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));['views','likes','comments'].forEach(k=>data[k]=Number(data[k]||0));['hook_strength','recreation_ease','monetization_potential'].forEach(k=>data[k]=Number(data[k]||0));const r=await fetch('/api/references',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const out=await r.json();$('#message').textContent=r.ok?'Referência cadastrada.':(out.detail||'Erro');if(r.ok){e.target.reset();load()}};async function setStatus(id,status){await fetch(`/api/references/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}async function agent(id){const r=await fetch(`/api/references/${id}/agent-task`,{method:'POST'});const o=await r.json();alert(r.ok?`Tarefa criada: ${o.task_id}`:(o.detail||'Erro'))}async function removeRef(id){if(confirm('Excluir referência?')){await fetch(`/api/references/${id}`,{method:'DELETE'});load()}}$('#refresh').onclick=load;$('#status').onchange=load;load();</script></body></html>
